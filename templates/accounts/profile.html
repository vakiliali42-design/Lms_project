<!-- templates/accounts/profile.html -->
{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}پروفایل{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card p-4">
      <div class="text-center mb-4">
        {% if request.user.avatar %}
        <img src="{{ request.user.avatar.url }}" class="rounded-circle"
             width="100" height="100" alt="avatar">
        {% else %}
        <i class="bi bi-person-circle" style="font-size:5rem; color:#6c757d;"></i>
        {% endif %}
        <h5 class="mt-2">{{ request.user.get_full_name }}</h5>
        <span class="badge bg-primary">{{ request.user.get_role_display }}</span>
      </div>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary w-100 mt-3">
          <i class="bi bi-save"></i> ذخیره تغییرات
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
